<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Draco 的实验报告库</title>

    <!-- 引入 Markdown 解析库与代码高亮样式（保留） -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>

    <!-- 引入 KaTeX 支持数学公式（保留） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js">
    </script>

    <style>
        /* ========== 全局与变量 ========== */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.78);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-width: 320px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft Yahei", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
            /* 防止滚动条跳动 */;
        }

        /* ========== 侧边栏（目录） ========== */
        sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 10;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.06) transparent;
            transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1),
                box-shadow 0.35s ease;
            will-change: transform;
        }

        sidebar::-webkit-scrollbar {
            width: 3px;
        }
        sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
        }

        /* 个人简介 */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 0.6rem;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }
        .avatar:hover {
            transform: scale(1.04) rotate(4deg);
        }

        .profile-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.1rem;
        }

        .profile-school {
            font-size: 0.75rem;
            color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
            padding: 1px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            margin-bottom: 0.3rem;
        }

        .profile-bio {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .menu-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 0.25rem 0 0.5rem 0.5rem;
            flex-shrink: 0;
        }

        /* 分类分组 */
        .category-group {
            margin-bottom: 0.15rem;
            flex-shrink: 0;
        }

        /* 分类标题（可点击折叠） */
        .category-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px 5px 8px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            border-left: 2px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .category-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .category-header:active {
            background: rgba(255, 255, 255, 0.06);
        }
        .category-header .cat-icon {
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .category-header .cat-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-header .cat-count {
            font-size: 0.6rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 0 7px;
            border-radius: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .category-header .fold-toggle {
            font-size: 0.6rem;
            opacity: 0.4;
            transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
            flex-shrink: 0;
            will-change: transform;
        }
        .category-header.active-cat {
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }
        .category-header.collapsed .fold-toggle {
            transform: rotate(-90deg);
        }

        /* 实验列表（可折叠） */
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding-left: 12px;
            padding-top: 2px;
            margin-top: 1px;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s ease,
                padding 0.25s ease;
            max-height: 800px;
            opacity: 1;
            list-style: none;
        }
        .category-header.collapsed+.report-list {
            max-height: 0;
            padding-top: 0;
            opacity: 0;
            pointer-events: none;
        }

        .report-item {
            padding: 4px 10px 4px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border-left: 2px solid transparent;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }
        .report-item .item-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-secondary);
            opacity: 0.25;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }
        .report-item .item-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .report-item .item-badge {
            font-size: 0.55rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0 5px;
            border-radius: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .report-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            transform: translateX(3px);
        }
        .report-item:hover .item-dot {
            opacity: 0.7;
            background: var(--accent-color);
        }
        .report-item:active {
            transform: scale(0.97);
            transition-duration: 0.06s;
        }
        .report-item.active {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
            font-weight: 500;
            border-left-color: var(--accent-color);
        }
        .report-item.active .item-dot {
            opacity: 1;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* ========== 主内容区域 ========== */
        main {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 2rem 2.5rem 2.5rem;
            max-width: 1000px;
            min-height: 100vh;
            background: var(--bg-color);
            position: relative;
            z-index: 5;
            transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1),
                opacity 0.3s ease;
            will-change: transform, opacity;
            overflow-y: auto;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 2rem 2.25rem;
            box-shadow: 0 16px 28px -6px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            min-height: 380px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 主内容区 - Markdown 排版 ========== */
        .markdown-body h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            color: var(--accent-color);
        }
        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
        }
        .markdown-body p {
            margin-bottom: 0.8rem;
            color: #cbd5e1;
        }
        .markdown-body code {
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            margin: 0.8rem 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 3px solid var(--accent-color);
            padding-left: 1rem;
            margin: 0.8rem 0;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 14px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        /* ========== 欢迎页 ========== */
        .welcome-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }
        .welcome-header .big-icon {
            font-size: 2.6rem;
            line-height: 1;
        }
        .welcome-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            border: none;
            padding: 0;
        }

        .welcome-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 2rem;
            margin: 1.2rem 0 0.8rem;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .welcome-stats .stat-item {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        .welcome-stats .stat-num {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
        }
        .welcome-stats .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .welcome-desc {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.7;
            margin: 0.4rem 0 0;
        }
        .welcome-desc strong {
            color: #e2e8f0;
        }

        /* ========== 详情卡片 ========== */
        .detail-card {
            animation: fadeDetail 0.4s ease forwards;
        }
        @keyframes fadeDetail {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-card .detail-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }
        .detail-card .detail-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .detail-card .detail-sub .tag {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
            padding: 1px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid rgba(56, 189, 248, 0.12);
        }
        .detail-card .detail-body {
            color: #cbd5e1;
            line-height: 1.7;
            margin: 0.4rem 0 1.2rem;
        }
        .detail-card .detail-body .label {
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
        .detail-card .detail-body .link-url {
            color: var(--accent-color);
            word-break: break-all;
            font-size: 0.82rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 12px;
            border-radius: var(--radius-sm);
            display: inline-block;
            max-width: 100%;
        }

        .btn-github {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 26px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.2, 0.64, 1), box-shadow 0.25s ease;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.2);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-github:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 28px rgba(56, 189, 248, 0.28);
        }
        .btn-github:active {
            transform: scale(0.96);
            transition-duration: 0.06s;
        }

        /* ========== 移动端返回按钮 ========== */
        .mobile-back {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 10px 4px 8px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.2s ease;
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg-color);
            border-bottom: 1px solid transparent;
            margin-bottom: 4px;
        }
        .mobile-back:active {
            color: var(--accent-color);
        }
        .mobile-back .back-arrow {
            font-size: 1.2rem;
            line-height: 1;
            transition: transform 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .mobile-back:active .back-arrow {
            transform: translateX(-4px);
        }

        /* ========== 响应式：移动端（< 820px） ========== */
        @media (max-width: 820px) {
            :root {
                --sidebar-width: 280px;
            }
            sidebar {
                width: var(--sidebar-width);
                padding: 1.2rem 1rem 0.8rem;
            }
            main {
                margin-left: var(--sidebar-width);
                padding: 1.2rem 1.5rem 1.5rem;
            }
            .content-card {
                padding: 1.5rem;
                min-height: 300px;
            }
            .welcome-stats {
                flex-direction: column;
                gap: 0.4rem;
                padding: 0.8rem 1.2rem;
            }
        }

        /* ========== 移动端（< 640px）视图切换模式 + 大字体 ========== */
        @media (max-width: 639px) {
            body {
                overflow: hidden;
                /* 防止页面滚动 */;
            }

            /* 侧边栏：全屏目录 */
            sidebar {
                width: 100%;
                height: 100vh;
                position: fixed;
                top: 0;
                left: 0;
                z-index: 10;
                border-right: none;
                padding: 1.2rem 1.2rem 0.8rem;
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                background: rgba(15, 23, 42, 0.97);
                transform: translateX(0);
                box-shadow: none;
                border-radius: 0;
            }

            /* 主内容：全屏覆盖层，默认在右侧隐藏 */
            main {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                margin-left: 0;
                padding: 0.8rem 1rem 1rem;
                z-index: 20;
                background: var(--bg-color);
                transform: translateX(100%);
                opacity: 1;
                overflow-y: auto;
                border-radius: 0;
                transition: transform 0.38s cubic-bezier(0.34, 1.2, 0.64, 1),
                    box-shadow 0.4s ease;
                will-change: transform;
                box-shadow: none;
            }
            /* 内容滑入状态 */
            main.active {
                transform: translateX(0);
                box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
            }

            /* 内容卡片在移动端撑满 */
            .content-card {
                padding: 1.2rem 1.2rem 1.5rem;
                min-height: auto;
                border-radius: var(--radius-md);
                background: var(--card-bg);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                margin-top: 0;
                animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            /* 移动端显示返回按钮 */
            .mobile-back {
                display: flex;
                font-size: 1rem;
                padding: 12px 4px 10px 0;
                gap: 8px;
            }
            .mobile-back .back-arrow {
                font-size: 1.4rem;
            }

            /* 移动端：让侧边栏内部可滚动 */
            sidebar {
                overflow-y: auto;
                padding-bottom: 1.5rem;
            }

            /* 移动端调整个人简介尺寸（增大） */
            .profile-card .avatar {
                width: 64px;
                height: 64px;
                font-size: 1.8rem;
            }
            .profile-name {
                font-size: 1.3rem;
            }
            .profile-school {
                font-size: 0.9rem;
                padding: 2px 16px;
            }
            .profile-bio {
                font-size: 0.85rem;
            }

            .menu-title {
                font-size: 0.8rem;
                margin: 0.5rem 0 0.6rem 0.5rem;
            }

            /* 分类标题 */
            .category-header {
                font-size: 0.95rem;
                padding: 8px 12px 8px 10px;
                gap: 10px;
            }
            .category-header .cat-icon {
                font-size: 1.05rem;
            }
            .category-header .cat-count {
                font-size: 0.75rem;
                padding: 0 10px;
            }
            .category-header .fold-toggle {
                font-size: 0.8rem;
            }

            /* 实验项 */
            .report-item {
                font-size: 0.92rem;
                padding: 8px 14px 8px 18px;
                gap: 8px;
            }
            .report-item .item-dot {
                width: 6px;
                height: 6px;
            }
            .report-item .item-badge {
                font-size: 0.7rem;
                padding: 0 8px;
            }

            /* 主内容区欢迎页 */
            .welcome-header h1 {
                font-size: 1.6rem;
            }
            .welcome-header .big-icon {
                font-size: 2.4rem;
            }
            .welcome-stats {
                padding: 0.8rem 1.2rem;
                gap: 0.5rem;
            }
            .welcome-stats .stat-num {
                font-size: 1.4rem;
            }
            .welcome-stats .stat-label {
                font-size: 0.9rem;
            }
            .welcome-desc {
                font-size: 1rem;
                line-height: 1.8;
            }

            /* 详情卡片 */
            .detail-card .detail-title {
                font-size: 1.4rem;
            }
            .detail-card .detail-sub {
                font-size: 0.95rem;
                gap: 12px;
            }
            .detail-card .detail-sub .tag {
                font-size: 0.8rem;
                padding: 2px 16px;
            }
            .detail-card .detail-body {
                font-size: 1rem;
                line-height: 1.8;
            }
            .detail-card .detail-body .label {
                font-size: 0.9rem;
            }
            .detail-card .detail-body .link-url {
                font-size: 0.9rem;
                padding: 5px 14px;
            }

            /* 按钮 */
            .btn-github {
                font-size: 1rem;
                padding: 12px 30px;
                width: 100%;
                justify-content: center;
                gap: 10px;
            }
        }

        /* ========== 极小屏（< 400px）再微调 ========== */
        @media (max-width: 399px) {
            sidebar {
                padding: 0.8rem 0.8rem 0.4rem;
            }
            .profile-card .avatar {
                width: 54px;
                height: 54px;
                font-size: 1.5rem;
            }
            .profile-name {
                font-size: 1.1rem;
            }
            .category-header {
                font-size: 0.85rem;
                padding: 6px 10px;
            }
            .report-item {
                font-size: 0.82rem;
                padding: 6px 10px 6px 14px;
            }
            main {
                padding: 0.5rem 0.6rem 0.8rem;
            }
            .content-card {
                padding: 0.8rem 0.8rem 1rem;
            }
            .detail-card .detail-title {
                font-size: 1.2rem;
            }
            .welcome-header h1 {
                font-size: 1.3rem;
            }
            .welcome-header .big-icon {
                font-size: 1.8rem;
            }
        }

        /* ========== 辅助类 ========== */
        .text-muted {
            color: var(--text-muted);
        }
        .mt-1 {
            margin-top: 0.4rem;
        }
        .mt-2 {
            margin-top: 0.8rem;
        }

        /* 平滑滚动 */
        .smooth-scroll {
            scroll-behavior: smooth;
        }

        /* 禁用点击高亮 */
        .no-tap-highlight {
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== 性能优化：减少合成层 ========== */
        .gpu-accelerated {
            transform: translateZ(0);
            will-change: transform;
        }
    </style>
</head>
<body>

    <!-- ========== 侧边栏（目录） ========== -->
    <sidebar id="sidebar">
        <div class="profile-card">
            <div class="avatar">👨‍💻</div>
            <div class="profile-name">Draco</div>
            <div class="profile-school">🎓 深圳大学</div>
            <div class="profile-bio">个人实验报告与学习记录库</div>
        </div>

        <div class="menu-title">📚 实验报告目录</div>

        <!-- 分类列表由 JavaScript 动态生成 -->
        <div id="categoryContainer"></div>
    </sidebar>

    <!-- ========== 主内容 ========== -->
    <main id="mainContent">
        <!-- 移动端返回按钮 -->
        <div class="mobile-back" id="mobileBack">
            <span class="back-arrow">‹</span>
            <span>返回目录</span>
        </div>

        <div class="content-card" id="contentCard">
            <div id="content" class="markdown-body">
                <!-- 默认由 JavaScript 渲染欢迎页 -->
            </div>
        </div>
    </main>

    <script>
        // ================================================================
        //  📌 实验数据 —— 完全来自第二个文件，保留名称、分类、链接
        // ================================================================
        const LAB_DATA = [{
            category: '大学物理实验',
            icon: '⚛',
            experiments: [
                { id: 'p1', label: '薄透镜实验', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/薄透镜实验' },
                { id: 'p2', label: '磁特性综合实验', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/磁特性综合实验' },
                { id: 'p3', label: '等厚干涉', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/等厚干涉' },
                { id: 'p4', label: '电子秤的设计', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/电子秤的设计' },
                { id: 'p5', label: '多普勒效应测声速', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/多普勒效应测声速' },
                { id: 'p6', label: '费米达拉克分布', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/费米达拉克分布' },
                { id: 'p7', label: '光敏电阻特性研究', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/光敏电阻特性研究' },
                { id: 'p8', label: '基于 multisim 的电源设计', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/基于 multisim 的电源设计' },
                { id: 'p9', label: '杨氏模量的测量', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/杨氏模量的测量' },
                { id: 'p10', label: '准稳态法测比热导热系数', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大物实验/准稳态法测比热导热系数' }
            ]
        }, {
            category: '计算机系统概论实验',
            icon: '🖥️',
            experiments: [
                { id: 'sp1', label: 'LC-3仿真器安装和使用', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/计算机系统概论实验/实验一 LC-3仿真器安装和使用' },
                { id: 'sp2', label: 'LC-3机器码编程试验', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/计算机系统概论实验/实验二 LC-3机器码编程试验' },
                { id: 'sp3', label: 'LC-3汇编语言实验1 求成绩等级', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/计算机系统概论实验/实验三 LC-3汇编语言实验1 求成绩等级' },
                { id: 'sp4', label: 'LC-3简单游戏设计', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/计算机系统概论实验/实验四 LC-3简单游戏设计' },
                { id: 'sp5', label: 'LC-3中断试验', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/计算机系统概论实验/实验五 LC-3中断试验' }
            ]
        }, {
            category: '数字电路实验',
            icon: '🔌',
            experiments: [
                { id: 'd1', label: '门电路逻辑功能及测试', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/数字电路/实验一' },
                { id: 'd2', label: '译码器功能测试及应用', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/数字电路/实验二' },
                { id: 'd3', label: '数据选择器', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/数字电路/实验三' },
                { id: 'd4', label: '集成触发器功能测试及转换', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/数字电路/实验四' },
                { id: 'd5', label: '彩灯流水电路的设计', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/数字电路/实验五' },
                { id: 'd6', label: '555 定时器电路', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/数字电路/实验六' }
            ]
        }, {
            category: '大学计算机实验',
            icon: '💻',
            experiments: [
                { id: 'c1', label: '实验1-文字信息处理+AI辅助工具使用', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大学计算机/实验1-文字信息处理+AI辅助工具使用' },
                { id: 'c2', label: '实验2-电子表格处理+AI辅助工具使用', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大学计算机/实验2-电子表格处理+AI辅助工具使用' },
                { id: 'c3', label: '实验3-演示文稿制作+AI辅助工具使用', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大学计算机/实验3-演示文稿制作+AI辅助工具使用' },
                { id: 'c4', label: '实验4-算法设计工具—Python编程能力', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大学计算机/实验4-算法设计工具—Python编程能力' },
                { id: 'c5', label: '实验5-算法设计工具—综合性任务的编程能力', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大学计算机/实验5-算法设计工具—综合性任务的编程能力' },
                { id: 'c6', label: '实验6-生成式人工智能工具辅助的创作型实验', link: 'https://github.com/blackchickenQ/myLabReport/tree/main/大学计算机/实验6-生成式人工智能工具辅助的创作型实验/实验6-生成式人工智能工具辅助的创作型实验' }
            ]
        }];

        // 统计
        const totalExps = LAB_DATA.reduce((acc, cat) => acc + cat.experiments.length, 0);
        const totalCats = LAB_DATA.length;

        // ================================================================
        //  工具：判断是否为移动端视图（< 640px）
        // ================================================================
        function isMobileView() {
            return window.innerWidth < 640;
        }

        // ================================================================
        //  渲染侧边栏（支持折叠）
        // ================================================================
        const container = document.getElementById('categoryContainer');

        function renderSidebar() {
            container.innerHTML = '';
            LAB_DATA.forEach((cat, catIdx) => {
                const group = document.createElement('div');
                group.className = 'category-group';

                // 默认折叠：添加 collapsed 类
                const header = document.createElement('div');
                header.className = 'category-header collapsed';
                header.dataset.catIndex = catIdx;
                header.innerHTML = `
                    <span class="cat-icon">${cat.icon}</span>
                    <span class="cat-name">${cat.category}</span>
                    <span class="cat-count">${cat.experiments.length}</span>
                    <span class="fold-toggle">▾</span>
                `;
                group.appendChild(header);

                const list = document.createElement('ul');
                list.className = 'report-list';
                cat.experiments.forEach((exp, expIdx) => {
                    const li = document.createElement('li');
                    li.className = 'report-item';
                    li.dataset.catIndex = catIdx;
                    li.dataset.expIndex = expIdx;
                    li.innerHTML = `
                        <span class="item-dot"></span>
                        <span class="item-label">${exp.label}</span>
                        <span class="item-badge">${String(expIdx + 1).padStart(2, '0')}</span>
                    `;
                    li.addEventListener('click', function(e) {
                        e.stopPropagation();
                        // 高亮实验项
                        document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');

                        // 高亮所属分类标题
                        const catIdx = parseInt(this.dataset.catIndex);
                        document.querySelectorAll('.category-header').forEach(h => h.classList.remove('active-cat'));
                        const targetHeader = document.querySelector(`.category-header[data-cat-index="${catIdx}"]`);
                        if (targetHeader) {
                            targetHeader.classList.add('active-cat');
                            if (targetHeader.classList.contains('collapsed')) {
                                targetHeader.classList.remove('collapsed');
                            }
                        }

                        // 渲染详情
                        const expIdx = parseInt(this.dataset.expIndex);
                        renderDetail(catIdx, expIdx);

                        // 移动端：滑入内容并 push 历史状态
                        if (isMobileView()) {
                            const mainEl = document.getElementById('mainContent');
                            mainEl.classList.add('active');
                            mainEl.scrollTop = 0;
                            // 添加历史记录，以支持返回键关闭详情
                            history.pushState({ mobileDetail: true }, '', '');
                        }
                        saveFoldState();
                    });
                    list.appendChild(li);
                });
                group.appendChild(list);
                container.appendChild(group);

                // 折叠交互
                header.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (e.target.closest('.report-item')) return;
                    this.classList.toggle('collapsed');
                    saveFoldState();
                });
            });
        }

        // ================================================================
        //  渲染主内容区
        // ================================================================
        const contentEl = document.getElementById('content');
        const mainEl = document.getElementById('mainContent');
        const mobileBack = document.getElementById('mobileBack');

        // 欢迎页
        function renderWelcome() {
            contentEl.innerHTML = `
                <div class="welcome-header">
                    <span class="big-icon">📘</span>
                    <h1>实验报告库</h1>
                </div>
                <div class="welcome-stats">
                    <div class="stat-item">
                        <span class="stat-num">${totalCats}</span>
                        <span class="stat-label">课程分类</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num">${totalExps}</span>
                        <span class="stat-label">实验报告</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num">📂</span>
                        <span class="stat-label">全部托管于 GitHub</span>
                    </div>
                </div>
                <p class="welcome-desc">
                    欢迎来到 <strong>Draco</strong> 的个人实验报告库 👋<br />
                    左侧按课程分类列出了所有实验项目，点击即可查看详情并跳转至 GitHub 仓库。
                </p>
                <p class="welcome-desc mt-1" style="font-size:0.82rem; color:var(--text-muted);">
                    💡 点击任意实验名称，右侧将显示该实验的详细信息，点击「查看报告」按钮直达 GitHub 目录。<br />
                    🗂️ 点击分类标题可展开/收起该分类下的实验列表。
                </p>
            `;
        }

        // 实验详情
        function renderDetail(catIdx, expIdx) {
            const cat = LAB_DATA[catIdx];
            const exp = cat.experiments[expIdx];
            if (!exp) return;

            const num = String(expIdx + 1).padStart(2, '0');

            contentEl.innerHTML = `
                <div class="detail-card">
                    <div class="detail-title">${exp.label}</div>
                    <div class="detail-sub">
                        <span class="tag">${cat.icon} ${cat.category}</span>
                        <span style="color:var(--text-muted);">实验 #${num}</span>
                    </div>
                    <div class="detail-body">
                        <p><span class="label">📌 所属课程：</span>${cat.category}</p>
                        <p><span class="label">🔗 GitHub 目录：</span></p>
                        <p><span class="link-url">${exp.link}</span></p>
                        <p style="margin-top:1rem; color:var(--text-muted); font-size:0.85rem;">
                            ⚡ 点击下方按钮，在新标签页中打开该实验的 GitHub 仓库目录。
                        </p>
                    </div>
                    <a href="${exp.link}" target="_blank" class="btn-github">
                        <span>📄</span> 查看报告
                    </a>
                </div>
            `;

            // 重新触发卡片动画
            const card = document.getElementById('contentCard');
            card.style.animation = 'none';
            void card.offsetHeight;
            card.style.animation = 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        }

        // ================================================================
        //  移动端：返回目录（手动 + 系统返回键）
        // ================================================================
        function closeContent() {
            if (isMobileView() && mainEl.classList.contains('active')) {
                mainEl.classList.remove('active');
                // 清除历史状态，避免重复触发
                history.replaceState(null, '', '');
            }
        }

        // 手动返回按钮
        mobileBack.addEventListener('click', closeContent);

        // 系统返回键 / 浏览器后退
        window.addEventListener('popstate', function(event) {
            if (isMobileView() && mainEl.classList.contains('active')) {
                // 如果当前是详情页，关闭它并阻止默认后退行为（实际上 popstate 已经触发了）
                closeContent();
                // 阻止继续后退（因为我们已经替换了状态）
                // 注意：这里不调用 event.preventDefault()，因为 popstate 不可取消
                // 而是通过 replaceState 清除了状态，所以再次后退不会重复触发
            }
        });

        // ================================================================
        //  折叠状态持久化（localStorage）
        // ================================================================
        function saveFoldState() {
            const headers = document.querySelectorAll('.category-header');
            const states = [];
            headers.forEach(h => {
                states.push(h.classList.contains('collapsed'));
            });
            try {
                localStorage.setItem('draco_fold_states', JSON.stringify(states));
            } catch (e) { /* ignore */ }
        }

        function restoreFoldState() {
            try {
                const data = localStorage.getItem('draco_fold_states');
                if (!data) return;
                const states = JSON.parse(data);
                const headers = document.querySelectorAll('.category-header');
                headers.forEach((h, i) => {
                    if (states[i] === true) {
                        h.classList.add('collapsed');
                    } else {
                        h.classList.remove('collapsed');
                    }
                });
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        //  窗口大小变化时，重置移动端状态
        // ================================================================
        let resizeTimer = null;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!isMobileView()) {
                    mainEl.classList.remove('active');
                }
            }, 150);
        });

        // ================================================================
        //  初始化
        // ================================================================
        renderSidebar();
        renderWelcome();

        // 恢复折叠状态（会覆盖默认的 collapsed）
        restoreFoldState();

        // 如果是在移动端，确保内容默认隐藏
        if (isMobileView()) {
            mainEl.classList.remove('active');
        }

        console.log('📚 Draco 实验报告库已加载，共 ' + totalExps + ' 份报告，默认全部折叠。');
    </script>

</body>
</html>
